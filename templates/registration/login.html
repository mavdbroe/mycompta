{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — MyCompta</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .boite { background: white; border: 1px solid var(--couleur-bordure); border-radius: 8px; padding: 40px; width: 300px; }
        .boite h1 { font-size: 15pt; margin-top: 0; }
        .boite label { display: block; margin-bottom: 6px; font-size: 9pt; color: #666; }
        .boite input { width: 100%; padding: 8px; margin-bottom: 16px; box-sizing: border-box; border: 1px solid var(--couleur-bordure); border-radius: 4px; }
        .boite button { width: 100%; }
    </style>
</head>
<body>
    <div class="boite">
        <h1>MyCompta</h1>
        {% if form.errors %}
        <p class="manquant">Nom d'utilisateur ou mot de passe incorrect.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Nom d'utilisateur</label>
            <input type="text" name="username" id="id_username" required autofocus>
            <label for="id_password">Mot de passe</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
