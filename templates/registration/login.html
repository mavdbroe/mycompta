<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — MyCompta</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #fafafa; }
        .boite { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 40px; width: 300px; }
        h1 { font-size: 16pt; margin-top: 0; }
        label { display: block; margin-bottom: 6px; font-size: 10pt; color: #555; }
        input { width: 100%; padding: 8px; margin-bottom: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .erreur { color: #c0392b; font-size: 10pt; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="boite">
        <h1>MyCompta</h1>
        {% if form.errors %}
        <p class="erreur">Nom d'utilisateur ou mot de passe incorrect.</p>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Nom d'utilisateur</label>
            <input type="text" name="username" id="id_username" required autofocus>
            <label for="id_password">Mot de passe</label>
            <input type="password" name="password" id="id_password" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
